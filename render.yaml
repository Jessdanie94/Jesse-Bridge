# Proposal only: no deployment or plan change performed.
services:
  - type: web
    name: jesse-autopilot-bridge
    runtime: python
    region: oregon
    plan: starter
    autoDeployTrigger: "off"
    buildCommand: pip install --require-hashes -r requirements.lock.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 15 --graceful-timeout 15 --keep-alive 5 --max-requests 1000 --max-requests-jitter 100 wsgi:app
    healthCheckPath: /health/ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: APP_ENV
        value: production
      - key: BRIDGE_INTAKE_ENABLED
        value: "false"
      - key: SHOPIFY_STORE_DOMAIN
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PORT
        value: 10000
    description: >-
      Review-only Flask scaffolding for signed order snapshots.
      Requires an explicit additive Postgres migration before readiness.
      No supplier dispatch, payment capture, payout or revenue guarantees.
